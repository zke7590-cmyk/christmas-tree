<!doctype html>
<html lang="zh-CN">
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Merry Christmas</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#f9edce;font:15px system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:pan-y}
header,footer{position:fixed;left:0;right:0;text-align:center;padding:18px;pointer-events:none}
header{top:env(safe-area-inset-top)}
footer{bottom:env(safe-area-inset-bottom);background:linear-gradient(transparent,#000d)}
h1{font:400 clamp(25px,5vw,39px) Georgia,"Songti SC",serif;letter-spacing:.09em;margin:6px 0}
p{margin:8px 0 12px;color:#e7e1d3}
.controls{display:flex;justify-content:center;flex-wrap:wrap}
button{pointer-events:auto;background:#101c31;color:inherit;border:1px solid #d8bb776b;border-radius:30px;min-height:44px;padding:0 13px;font:inherit;cursor:pointer}
button:hover,button:focus-visible{background:#24344c;outline-color:#f2cf80}
[hidden]{display:none!important}
header{top:0;top:env(safe-area-inset-top)}
footer{bottom:0;bottom:env(safe-area-inset-bottom)}
.controls button{margin:4px}
#viewer{position:fixed;inset:0;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;background:#060e20db;z-index:2}
#viewer section{padding:12px;text-align:center;background:#111e33;border:1px solid #d8bb77;border-radius:16px}
#viewer img{display:block;max-width:72vw;max-height:62vh;object-fit:contain;margin-bottom:10px}
</style>
</head>
<body>
<canvas aria-label="旋转的粒子圣诞树"></canvas>
<header><h1>Merry Christmas</h1></header>
<footer>
<p id="status" role="status">左右拖动转树 · 点击照片放大</p>
<div class="controls">
<button id="shape">散开星尘</button>
<button id="photos">添加照片</button>

</div>
<input id="files" type="file" accept="image/*" multiple hidden>
</footer>
<div id="viewer" role="dialog" aria-modal="true" aria-label="照片预览" hidden>
<section><img alt="你添加的照片"><button id="close">关闭照片</button></section>
</div>
<script>

const canvas=document.querySelector('canvas'), ctx=canvas.getContext('2d');
const shape=document.querySelector('#shape');
const status=document.querySelector('#status'), files=document.querySelector('#files');
const viewer=document.querySelector('#viewer');

const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const tau=Math.PI*2, random=Math.random;
let width,height,scale,spread=0,target=0,angle=.22,lastFrame=0,animation;
let cards=[], hitCards=[], selection=0;
const scatterSites=[
  [.19,.32], [.77,.61], [.68,.23], [.28,.71],
  [.88,.40], [.43,.43], [.14,.53], [.58,.74],
  [.41,.19], [.64,.48], [.31,.56], [.83,.76]
];
let rotationTarget=angle, manualRotation=false;
const greens=['#237047','#32975b','#42bb73','#64dc91','#99efae'];
const golds=['#caa567','#e4c38b','#f1dcb1'];
const reds=['#994a49','#c06e61'];
const ice=['#8fbecf','#b5d9e6'];
function glowSprite(color){
  const sprite=document.createElement('canvas');
  sprite.width=sprite.height=32;
  const brush=sprite.getContext('2d');
  const glow=brush.createRadialGradient(16,16,0,16,16,16);
  glow.addColorStop(0,'#fff9df');
  glow.addColorStop(.21,color);
  glow.addColorStop(.42,color+'70');
  glow.addColorStop(1,color+'00');
  brush.fillStyle=glow;
  brush.fillRect(0,0,32,32);
  return sprite;
}
const sprites=new Map([...greens,...golds,...reds].map(color=>[color,glowSprite(color)]));
const tiers=[
  {top:-.52,bottom:-.20,radius:.17},
  {top:-.38,bottom:-.04,radius:.23},
  {top:-.22,bottom:.13,radius:.30},
  {top:-.06,bottom:.30,radius:.37},
  {top:.10,bottom:.48,radius:.43}
];
const pointCount=3600;
const points=Array.from({length:pointCount},(_,i)=>{
  const a=random()*tau, fraction=random();
  const ribbon=i<480;
  const trunk=i>=pointCount-65;
  const tier=tiers[i%tiers.length];
  const y=trunk ? .47+fraction*.095 : ribbon ? fraction*.90-.44 : tier.top+(tier.bottom-tier.top)*fraction;
  const theta=ribbon ? fraction*tau*8.5 : a;
  const radius=trunk ? Math.sqrt(random())*.043 : ribbon ? .06+fraction*.39 :
    tier.radius*Math.pow(fraction,.79)*(.34+.66*Math.sqrt(random()))*(.94+.06*Math.cos(theta*9));
  const orbit=.24+.53*random(), phi=Math.acos(2*random()-1);
  const gold=ribbon||trunk||i%21===0;
  const ornament=!gold&&i%61===0;
  const hue=ornament ? reds[i%reds.length] : gold ? golds[i%golds.length] : i%17===0 ? ice[i%ice.length] : greens[Math.floor(random()*greens.length)];
  const green=!gold&&!ornament&&i%17!==0;
  const shimmer=green&&i%9===0;
  return {x:Math.cos(theta)*radius,y,z:Math.sin(theta)*radius,
    sx:Math.cos(a)*Math.sin(phi)*orbit,sy:Math.cos(phi)*orbit*.82,sz:Math.sin(a)*Math.sin(phi)*orbit,
    hue,gold,ornament,green,shimmer,size:ornament ? 2.6+random()*1.5 : .55+random()**2*2.15,phase:random()*tau};
});
const snow=Array.from({length:330},()=>{
  const depth=random()**2;
  return {x:random(),y:random(),depth,phase:random()*tau};
});
const snowGlow=glowSprite('#bddcff');
function drawSnow(time){
  for(const flake of snow){
    const {depth,phase}=flake;
    const margin=20;
    const y=(flake.y*(height+2*margin)+time*(17+depth*75))%(height+2*margin)-margin;
    const x=flake.x*width+Math.sin(time*(.48+depth*.5)+phase)*(7+depth*17);
    const radius=.55+depth*1.55;
    ctx.globalAlpha=.16+depth*.38;
    if(depth>.76){
      const size=radius*5;
      ctx.drawImage(snowGlow,x-size/2,y-size/2,size,size);
    }else{
      ctx.fillStyle='#e4efff';
      ctx.beginPath();
      ctx.arc(x,y,radius,0,tau);
      ctx.fill();
    }
  }
  ctx.globalAlpha=1;
}
function resize(){
  width=innerWidth;height=innerHeight;
  const dpr=Math.min(devicePixelRatio||1,1.5);
  canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  scale=Math.min(width*.83,height*.62);
}
addEventListener('resize',resize);resize();
function project(x,y,z){
  const cos=Math.cos(angle), sin=Math.sin(angle);
  const depth=x*sin+z*cos, perspective=1/(1+depth*.46);
  return {x:width*.5+(x*cos-z*sin)*scale*perspective,
    y:height*.46+(y-depth*.10)*scale*perspective,depth,perspective};
}
function setSpread(open){
  target=Number(open);
  shape.textContent=open?'聚成圣诞树':'散开星尘';
}
shape.addEventListener('click',()=>setSpread(!target));
function star(p,time){
  ctx.save();ctx.translate(p.x,p.y);
  ctx.shadowBlur=11;ctx.shadowColor='#c5a66b';ctx.fillStyle='#eed9a7';
  ctx.beginPath();
  const r=scale*.047;
  for(let i=0;i<10;i++){
    const a=i*Math.PI/5-Math.PI/2, d=i%2?r*.38:r;
    ctx.lineTo(Math.cos(a)*d,Math.sin(a)*d);
  }
  ctx.closePath();ctx.globalAlpha=(.94+.06*Math.sin(time*2))*(1-spread)**2;ctx.fill();ctx.restore();
}
function drawFoliage(){
  const settled=Math.max(0,1-spread/.23);
  if(settled===0)return;
  ctx.save();
  ctx.globalAlpha=.63*settled*settled*(3-2*settled);
  for(let i=tiers.length-1;i>=0;i--){
    const tier=tiers[i];
    const tip=project(0,tier.top,0), base=project(0,tier.bottom,0);
    const r=tier.radius*scale*.91;
    const foliage=ctx.createLinearGradient(base.x-r,0,base.x+r,0);
    foliage.addColorStop(0,'#153927');
    foliage.addColorStop(.42,'#316d4a');
    foliage.addColorStop(.72,'#275a3c');
    foliage.addColorStop(1,'#123526');
    ctx.fillStyle=foliage;
    ctx.beginPath();
    ctx.moveTo(tip.x,tip.y);
    ctx.quadraticCurveTo(base.x+r*.43,base.y-r*.26,base.x+r,base.y);
    ctx.quadraticCurveTo(base.x,base.y+r*.26,base.x-r,base.y);
    ctx.quadraticCurveTo(base.x-r*.50,base.y-r*.21,tip.x,tip.y);
    ctx.fill();
  }
  ctx.restore();
}
function draw(time){
  const dt=Math.min(40,time-lastFrame);lastFrame=time;
  const t=reduced?0:time/1000;
  if(manualRotation){
    angle+=(rotationTarget-angle)*(reduced?1:1-Math.exp(-dt/76));
  }else if(!reduced&&viewer.hidden){
    angle+=dt*.00034;
  }
  spread+=(target-spread)*(reduced?1:1-Math.exp(-dt/(target?265:480)));
  ctx.fillStyle='#000';ctx.fillRect(0,0,width,height);
  drawSnow(t);
  drawFoliage();
  ctx.globalCompositeOperation='source-over';
  for(const p of points){
    const delay=p.phase/tau*.24;
    const flight=Math.max(0,Math.min(1,(spread-delay)/(1-delay)));
    const eased=flight*flight*(3-2*flight);
    const x=p.x+(p.sx-p.x)*eased;
    const y=p.y+(p.sy-p.y)*eased;
    const z=p.z+(p.sz-p.z)*eased;
    const turn=reduced?0:Math.sin(Math.PI*eased)*(1.08+p.y*.45);
    const cos=Math.cos(turn),sin=Math.sin(turn);
    const dot=project(x*cos-z*sin,y,x*sin+z*cos);
    const size=p.size*dot.perspective*Math.min(1.22,scale/300);
    const pulse=.5+.5*Math.sin(t*(p.gold?2.1:p.shimmer?1.85:1.2)+p.phase);
    ctx.globalAlpha=(p.gold||p.ornament ? .80+pulse*.18 : p.green ? .77+pulse*.22 : .73+pulse*.21)*Math.min(1,1-dot.depth*.48);
    if((p.gold && p.size>1.1)||(p.shimmer && pulse>.57)){
      const glow=size*(p.gold?4.65:3.8);
      ctx.drawImage(sprites.get(p.hue),dot.x-glow/2,dot.y-glow/2,glow,glow);
      ctx.fillStyle=pulse>.82 ? (p.gold?"#fff3d4":"#c5ffd0") : p.hue;
      ctx.beginPath();ctx.arc(dot.x,dot.y,size*.38,0,tau);ctx.fill();
    }else{
      ctx.fillStyle=p.hue;
      ctx.beginPath();
      ctx.arc(dot.x,dot.y,size*.54,0,tau);
      ctx.fill();
    }
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  star(project(0,-.575,0),t);
  hitCards=cards.map((image,i)=>{
    const a=i*tau/cards.length;
    const resting=project(Math.cos(a)*.24,(i%3-1)*.16,Math.sin(a)*.24);
    const flight=spread*spread*(3-2*spread);
    const sweep=reduced?0:Math.sin(Math.PI*flight);
    const [siteX,siteY]=scatterSites[i];
    const drift=i%2===0?1:-1;
    const phase=i*2.39996;
    const floating=reduced?0:t*.65+phase;
    const depth=Math.sin(phase)*.34+(reduced?0:Math.sin(floating)*.16);
    const perspective=1/(1+depth*.61);
    const size=scale*(.15*resting.perspective*(1-flight)+(.19+(i%4)*.024)*perspective*flight);
    const padding=size*.74+9;
    const driftX=reduced?0:Math.sin(floating)*scale*.095;
    const driftY=reduced?0:Math.cos(floating*.83)*scale*.071;
    const scatteredX=width*(.5+(siteX-.5)*perspective)+driftX;
    const scatteredY=height*(.46+(siteY-.46)*perspective)+driftY;
    const x=resting.x+(scatteredX-resting.x)*flight+sweep*scale*.19*drift;
    const y=resting.y+(scatteredY-resting.y)*flight-sweep*scale*(.12+(i%3)*.08)*drift;
    return {
      x:Math.max(padding,Math.min(width-padding,x)),
      y:Math.max(padding,Math.min(height-padding,y)),
      depth:resting.depth*(1-flight)+depth*flight,image,i,size,
      tilt:reduced?0:Math.sin(floating)*flight*.15+drift*sweep*.27
    };
  }).sort((a,b)=>b.depth-a.depth);
  for(const card of hitCards){
    const {size}=card;
    ctx.save();ctx.translate(card.x,card.y);ctx.rotate(card.tilt);
    ctx.shadowColor='#f6cb77';ctx.shadowBlur=card.i===selection?15:5;
    ctx.fillStyle=card.i===selection?'#fff0b4':'#cdaa66';
    ctx.fillRect(-size/2-2,-size/2-2,size+4,size+4);ctx.shadowBlur=0;
    const im=card.image, crop=Math.min(im.naturalWidth,im.naturalHeight);
    ctx.drawImage(im,(im.naturalWidth-crop)/2,(im.naturalHeight-crop)/2,crop,crop,-size/2,-size/2,size,size);
    ctx.restore();
  }
  animation=requestAnimationFrame(draw);
}
function syncAnimation(){
  cancelAnimationFrame(animation);
  if(!document.hidden){lastFrame=performance.now();animation=requestAnimationFrame(draw);}
}
document.addEventListener('visibilitychange',syncAnimation);
syncAnimation();
document.querySelector('#photos').addEventListener('click',()=>files.click());
files.addEventListener('change',async()=>{
  const selected=[...files.files].slice(0,12);
  files.value='';
  const loaded=await Promise.all(selected.map(async file=>{
    const src=URL.createObjectURL(file), image=new Image();
    return new Promise(resolve=>{
      image.addEventListener('load',()=>resolve(image),{once:true});
      image.addEventListener('error',()=>{URL.revokeObjectURL(src);resolve(null)},{once:true});
      image.src=src;
    });
  }));
  if(!loaded.some(Boolean)){if(selected.length)status.textContent='照片无法打开，请试试 JPG 或 PNG';return}
  cards.forEach(image=>URL.revokeObjectURL(image.src));
  cards=loaded.filter(Boolean);selection=0;
  setSpread(true);
  status.textContent='左右拖动转树 · 点击照片放大';
});
function openCard(index){
  if(!cards[index]||!viewer.hidden)return;
  viewer.querySelector('img').src=cards[index].src;
  viewer.hidden=false;
  document.querySelector('#close').focus();
}
function closeCard(){
  viewer.hidden=true;
  document.querySelector('#photos').focus();
}
document.querySelector('#close').addEventListener('click',closeCard);
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'&&!viewer.hidden)closeCard();
});
let drag;
let dragged=false;
canvas.addEventListener('pointerdown',event=>{
  if(!event.isPrimary||event.button!==0)return;
  drag={id:event.pointerId,start:event.clientX,last:event.clientX};
  dragged=false;
  if(canvas.setPointerCapture)canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener('pointermove',event=>{
  if(!drag||drag.id!==event.pointerId)return;
  if(!dragged&&Math.abs(event.clientX-drag.start)<6)return;
  if(!manualRotation){manualRotation=true;rotationTarget=angle;}
  dragged=true;
  rotationTarget+=(event.clientX-drag.last)/Math.max(1,width)*tau;
  drag.last=event.clientX;
});
['pointerup','pointercancel','lostpointercapture'].forEach(type=>{
  canvas.addEventListener(type,event=>{if(drag&&drag.id===event.pointerId)drag=undefined;});
});
canvas.addEventListener('click',event=>{
  if(dragged){dragged=false;return}
  const card=[...hitCards].reverse().find(p=>{
    const x=event.clientX-p.x,y=event.clientY-p.y;
    const cos=Math.cos(p.tilt),sin=Math.sin(p.tilt),edge=p.size/2+6;
    return Math.abs(x*cos+y*sin)<edge&&Math.abs(y*cos-x*sin)<edge;
  });
  if(card){selection=card.i;openCard(card.i)}else setSpread(!target);
});

</script>
</body>
</html>
